[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindfolded-expert-iteration"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "scipy>=1.11,<2",
  "torch==2.7.1",
  "transformers==4.55.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
